<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nokslock - Coming Soon</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="shortcut icon" href="logo-blue.png" type="image/x-icon" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lexend:wght@100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>

    <section>
        <div class="container-fluid">
            <div class="row">
                <div class="col text-end p-2">
                    <p id="demo"></p>
                </div>
            </div>
        </div>
    </section>
    <section>
      <div class="conntainer pt-lg-5 mt-lg-5 pt-3 mt-3">
        <div class="row">
          <div class="col-12 text-center">
            <img src="loogo-circled.png" width="100" height="100" alt="" />
          </div>
        </div>
      </div>
    </section>

    <section>
      <div class="container">
        <div class="row">
          <div class="col-12 text-center">
            <h1>
              Security at it's Peak <br />
              with
              <img src="text.png" class="logo-text" />
            </h1>
          </div>

          <div class="col-lg-3"></div>
          <div class="col-lg-6 col-12 text-center p-3">
            <p>
              Lorem ipsum dolor sit amet, consectetur adipiscing elit. Sed
              facilisis erat at quam pharetra dignissim. Aliquam pharetra
              bibendum risus, et rhoncus erat condimentum non. 
            </p>
          </div>
           <div class="col-lg-3"></div>
          <div class="col-12 text-center p-lg-3 p-1">
            <button type="button" data-bs-toggle="modal" data-bs-target="#staticBackdrop3">Join the waitlist</button>
          </div>
        </div>
      </div>
    </section>
    <!-- Modal -->
<div class="modal fade" id="staticBackdrop3" tabindex="-1" aria-labelledby="exampleModalLabel3" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered justify-content-center">
        <div class="modal-content w-75">
            <div class="modal-header">
                <h5 class="modal-title" id="exampleModalLabel3">Get Notified 🛎️</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body p-4">
                <form>
                    <!-- Name input -->
                    <div data-mdb-input-init class="form-outline mb-4">
                        <input type="text" id="name3" class="form-control" />
                        <label class="form-label" for="name3">Name</label>
                    </div>

                    <!-- Email input -->
                    <div data-mdb-input-init class="form-outline mb-4">
                        <input type="email" id="email3" class="form-control" />
                        <label class="form-label" for="email3">Email address</label>
                    </div>

                    <!-- Checkbox -->
                    <div class="form-check d-flex justify-content-center mb-4">
                        <input class="form-check-input me-2" type="checkbox" value="" id="checkbox3" checked />
                        <label class="form-check-label" for="checkbox3">
                            I have read and agree to the terms
                        </label>
                    </div>

                    <!-- Submit button -->
                    <button type="submit" class="btn btn-primary d-block mx-auto">Send</button>
                </form>
            </div>
        </div>
    </div>
</div>
    <section>
        <div class="container pt-lg-3 pt-1">
            <div class="row">
                <div class="col-lg-2">
                </div>
                <div class="col">
                    <img src="mock-up-cropped.png" class="img-fluid desktop-mock-up" alt="">
                    <img src="mock-up.png" class="img-fluid mobile-mock-up" alt="">
                </div>
                <div class="col-lg-2">
                </div>
            </div>
        </div>
    </section>

    <section class="footer p-3">
              <div class="container">
        <div class="row">
          <div class="col-6 text-start">© 2025 Nokslock</div>
          <div class="col-6 text-end">
            <ul>
              <li>
                <a href=""
                  ><i class="fa-brands fa-twitter" style="color: #ffffff"></i
                ></a>
              </li>
              <li>
                <a href=""
                  ><i class="fa-brands fa-instagram" style="color: #ffffff"></i
                ></a>
              </li>

            </ul>
          </div>
        </div>
      </div>
    </section>
  </body>

  <script src="timer.js"></script>

  <script
    src="https://kit.fontawesome.com/b27c21c004.js"
    crossorigin="anonymous"
  ></script>
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"
  ></script>
</html>
